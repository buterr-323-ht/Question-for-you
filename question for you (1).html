<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>question for you 🐱</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🐱%3C/text%3E%3C/svg%3E">
<style>
:root{--bg1:#FFE9F2;--bg2:#FFD6E7;--card:#FFFFFF;--ink:#5B3347;--soft:#A5688A;--pink:#FF5C9D;--ring:#FF8FC4;--yel:#FFC94D;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{color-scheme:light}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100dvh;overflow-x:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:linear-gradient(180deg,var(--bg1),var(--bg2));background-attachment:fixed}
main{min-height:100dvh;display:grid;place-items:center;padding:60px 16px 40px;position:relative}
.bg{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.bg span{position:absolute;font-size:30px;opacity:.75;animation:fl 5s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-12px) rotate(8deg)}}
.wrap{position:relative;width:min(100%,460px)}
.card{position:relative;background:var(--card);border:6px solid var(--ring);border-radius:44px;padding:70px 22px 54px;text-align:center;box-shadow:0 24px 60px rgba(255,92,157,.25)}
.ear{position:absolute;top:-34px;width:0;height:0;border-left:34px solid transparent;border-right:34px solid transparent;border-bottom:56px solid var(--ring);filter:drop-shadow(0 4px 4px rgba(255,92,157,.2))}
.ear.l{left:15%;transform:rotate(-14deg)}.ear.r{right:15%;transform:rotate(14deg)}
.cat{font-size:84px;line-height:1;animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
h1{font-size:clamp(2rem,9vw,2.6rem);line-height:1.2;margin:22px 0 10px;font-weight:700}
h1 b{color:var(--pink);font-weight:700}
.sub{margin:0 0 44px;color:var(--soft);font-size:1.05rem}
.btns{display:flex;gap:16px;justify-content:center;align-items:center;min-height:70px}
button{font:inherit;font-weight:700;cursor:pointer;border-radius:999px;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
#yes{border:0;color:#fff;font-size:1.25rem;padding:20px 42px;background:linear-gradient(135deg,#FF5C9D,#FF3D8B);box-shadow:0 10px 22px rgba(255,61,139,.35);transition:transform .2s}
#yes:hover{transform:scale(1.07)}
#no{background:transparent;color:var(--pink);border:3px solid var(--ring);font-size:1.15rem;padding:15px 44px;z-index:30;transition:left .5s cubic-bezier(.34,1.56,.64,1),top .5s cubic-bezier(.34,1.56,.64,1)}
#no.mv{pointer-events:none}
#ghost{display:inline-block}
#hint{margin:34px 0 0;min-height:1.5em;font-style:italic;color:var(--soft);opacity:.85;transition:opacity .3s}
.fl{position:fixed;pointer-events:none;z-index:50;will-change:transform,opacity}
#modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:20px;background:rgba(255,200,225,.35);backdrop-filter:blur(2px)}
#modal[hidden]{display:none}
.pop{width:min(100%,400px);background:#fff;color:#5B3347;border:6px solid var(--yel);border-radius:36px;padding:34px 22px 30px;text-align:center;box-shadow:0 24px 60px rgba(255,92,157,.35);animation:pop .55s cubic-bezier(.2,1.3,.4,1) both}
@keyframes pop{from{opacity:0;transform:scale(.7) translateY(30px)}}
.pop .cat{font-size:76px}.pop h2{margin:14px 0 4px;font-size:2.4rem;color:var(--pink)}.pop p{margin:0 0 22px;color:#A5688A;font-size:1.1rem}
#yay{border:0;background:var(--yel);color:#6b3f12;font-size:1.2rem;padding:14px 40px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="bg" aria-hidden="true">
  <span style="left:10%;top:9%">🐾</span><span style="left:48%;top:6%;animation-delay:-1s">✨</span>
  <span style="right:8%;top:14%;animation-delay:-2s">💗</span><span style="left:7%;bottom:10%;animation-delay:-3s">🐾</span>
  <span style="right:12%;bottom:8%;animation-delay:-1.5s">✨</span>
</div>
<main>
  <div class="wrap">
    <div class="card">
      <i class="ear l"></i><i class="ear r"></i>
      <div class="cat" id="cat">😺</div>
      <h1><b id="nm"></b> <span id="q"></span></h1>
      <p class="sub" id="sub"></p>
      <div class="btns">
        <button id="yes" type="button"></button>
        <span id="ghost" hidden></span>
        <button id="no" type="button"></button>
      </div>
      <p id="hint" aria-live="polite"></p>
    </div>
  </div>
</main>
<div id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="mh">
  <div class="pop">
    <div class="cat">😼</div>
    <h2 id="mh"></h2>
    <p id="mp"></p>
    <button id="yay" type="button"></button>
  </div>
</div>

<script>
/* ============ CUSTOMIZE HERE ============ */
const CONFIG = {
  name: "Soumya",
  question: "wanna go on date with me?",
  subtitle: "a very serious question, meow 🐾",
  yesLabel: "Yes 😻",
  noLabel: "No",
  hint: "“No” seems a bit shy 🙈",
  noHints: ["too slow! 🙈", "are you sure? 🥺", "the Yes button looks cuter 👀", "nice try, cutie 💕", "meow… just say yes 😽"],
  successHeading: "I knew it.",
  successText: "soumya said yes! 🎉💗",
  yayLabel: "yay!"
};
/* ======================================== */
const $ = id => document.getElementById(id);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
$('nm').textContent = CONFIG.name; $('q').textContent = CONFIG.question; $('sub').textContent = CONFIG.subtitle;
$('yes').textContent = CONFIG.yesLabel; $('no').textContent = CONFIG.noLabel; $('hint').textContent = CONFIG.hint;
$('mh').textContent = CONFIG.successHeading; $('mp').textContent = CONFIG.successText; $('yay').textContent = CONFIG.yayLabel;

let live = 0;
function float(x, y, ch, o = {}) {
  if (reduce || live > 80) return; live++;
  const e = document.createElement('span'); e.className = 'fl'; e.textContent = ch;
  e.style.cssText = `left:${x}px;top:${y}px;font-size:${o.size || 16 + Math.random()*16}px`;
  document.body.appendChild(e);
  const dx = o.dx ?? (Math.random()-.5)*60, dy = o.dy ?? -120;
  const a = e.animate([{transform:'translate(0,0) scale(.5)',opacity:0},{transform:`translate(${dx/3}px,${dy/3}px) scale(1)`,opacity:1,offset:.2},{transform:`translate(${dx}px,${dy}px) rotate(${(Math.random()-.5)*50}deg)`,opacity:0}],{duration:o.dur||2000+Math.random()*1200,easing:'ease-out'});
  a.onfinish = () => { e.remove(); live--; };
}
setInterval(() => { if (!document.hidden) float(Math.random()*innerWidth, innerHeight+10, ['💗','🐾','💖','✨'][Math.random()*4|0], {dy:-(innerHeight+60),dur:7000+Math.random()*4000,size:14+Math.random()*12}); }, 1100);

const no = $('no'), yes = $('yes'), ghost = $('ghost'), hint = $('hint');
let tries = 0, idx = 0, det = false, lx = 0, ly = 0;
const hit = (x,y,w,h,r,p) => x < r.right+p && x+w > r.left-p && y < r.bottom+p && y+h > r.top-p;
function detach() {
  if (det) return;
  const r = no.getBoundingClientRect();
  ghost.hidden = false; ghost.style.width = r.width+'px'; ghost.style.height = r.height+'px';
  no.style.transition = 'none'; no.style.position = 'fixed'; no.style.left = r.left+'px'; no.style.top = r.top+'px'; no.style.margin = '0';
  lx = r.left; ly = r.top; det = true; void no.offsetWidth; no.style.transition = '';
}
function dodge() {
  detach();
  const w = no.offsetWidth, h = no.offsetHeight, m = 14, W = innerWidth, H = innerHeight;
  const avoid = [yes.getBoundingClientRect(), hint.getBoundingClientRect()];
  let x = lx, y = ly, fb = null;
  for (let i = 0; i < 60; i++) {
    const cx = m + Math.random()*Math.max(1, W-w-2*m), cy = m + Math.random()*Math.max(1, H-h-2*m);
    if (avoid.some(r => hit(cx,cy,w,h,r,16))) continue;
    if (Math.hypot(cx-lx, cy-ly) < Math.min(140, W/3)) { fb = fb || [cx,cy]; continue; }
    x = cx; y = cy; fb = null; break;
  }
  if (fb) [x,y] = fb;
  lx = x; ly = y; no.style.left = x+'px'; no.style.top = y+'px';
  no.classList.add('mv'); setTimeout(() => no.classList.remove('mv'), 420);
  tries++;
  if (tries >= 2) {
    const t = CONFIG.noHints[idx++ % CONFIG.noHints.length];
    hint.style.opacity = 0; setTimeout(() => { hint.textContent = t; hint.style.opacity = .85; }, 220);
    $('cat').textContent = ['😿','🙀','😾','😹'][idx % 4];
  }
}
no.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') dodge(); });
no.addEventListener('pointerdown', e => { e.preventDefault(); dodge(); });
no.addEventListener('touchstart', e => { e.preventDefault(); dodge(); }, {passive:false});
no.addEventListener('click', e => { e.preventDefault(); if (e.detail === 0) { tries = Math.max(tries, 2); dodge(); } });
addEventListener('resize', () => {
  if (!det) return;
  lx = Math.min(lx, Math.max(0, innerWidth - no.offsetWidth - 14)); ly = Math.min(ly, Math.max(0, innerHeight - no.offsetHeight - 14));
  no.style.left = lx+'px'; no.style.top = ly+'px';
});

function burst() {
  const cx = innerWidth/2, cy = innerHeight/2, set = ['💖','💗','🐾','✨','🎉','😻','🌸'];
  for (let i = 0; i < 36; i++) {
    const a = Math.random()*Math.PI*2, d = 90 + Math.random()*Math.min(innerWidth,420)*.6;
    float(cx, cy, set[i % set.length], {size:18+Math.random()*18, dx:Math.cos(a)*d, dy:Math.sin(a)*d-50, dur:1500+Math.random()*1200});
  }
}
yes.addEventListener('click', () => { $('modal').hidden = false; burst(); $('yay').focus({preventScroll:true}); });
$('yay').addEventListener('click', burst);
</script>
</body>
</html>
